; Allied Awaaz terminal, ESP32-S3-DevKitC-1 (N16R8: 16 MB flash, 8 MB PSRAM)
[env:awaaz-s3]
platform = espressif32@6.9.0          ; Arduino core 2.0.x (legacy I2S driver API)
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    ricmoo/QRCode@^0.0.1
    chris--a/Keypad@^3.1.1
build_flags =
    -Wall
    -DBOARD_HAS_PSRAM
    -DMQTT_MAX_PACKET_SIZE=1024
    ; TFT_eSPI configured here instead of editing the library's User_Setup.h
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=14
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DTOUCH_CS=-1
    -DUSE_FSPI_PORT=1
